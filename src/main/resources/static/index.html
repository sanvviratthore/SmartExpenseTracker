<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0A1410;--bg-card:#10201A;--bg-card-2:#142822;
  --purple:#10B981;--purple-light:#34D399;--purple-dim:rgba(16,185,129,0.15);
  --cyan:#14B8A6;--cyan-light:#5EEAD4;
  --gold:#F59E0B;--red:#F87171;--green:#34D399;
  --text:#E7F2EC;--text-muted:#8FA79D;
  --border:rgba(16,185,129,0.22);
  --radius:12px;
  --glow-purple:0 0 24px rgba(16,185,129,0.4);
  --glow-cyan:0 0 24px rgba(20,184,166,0.35);
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh;overflow-x:hidden;}
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
a{color:var(--purple-light);}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:'Space Grotesk',sans-serif;}
[hidden]{display:none!important;}

/* ---- shared bits ---- */
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--cyan);letter-spacing:.12em;display:block;margin-bottom:6px;}
.card{background:linear-gradient(160deg,var(--bg-card),var(--bg-card-2));border:1px solid var(--border);border-radius:var(--radius);}
.btn-primary{background:var(--purple);color:#fff;border:none;padding:12px 24px;border-radius:8px;font-weight:600;font-size:14px;transition:background .2s,transform .15s,box-shadow .2s;}
.btn-primary:hover{background:#6D28D9;transform:translateY(-1px);box-shadow:var(--glow-purple);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border);padding:9px 16px;border-radius:8px;font-size:13px;transition:all .2s;}
.btn-ghost:hover{border-color:var(--purple);color:var(--purple-light);}
.form-error{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.35);color:var(--red);font-size:13px;padding:10px 14px;border-radius:8px;margin-bottom:16px;}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan-light);outline-offset:2px;}

/* ---- auth screen ---- */
#auth-screen{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-card{width:100%;max-width:400px;padding:36px 32px;text-align:center;}
.app-logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;letter-spacing:.18em;color:var(--purple-light);margin-bottom:22px;}
#auth-title{font-size:22px;font-weight:700;margin-bottom:22px;}
#auth-form{display:flex;flex-direction:column;gap:16px;text-align:left;}
#auth-form label{font-size:12px;color:var(--text-muted);display:flex;flex-direction:column;gap:6px;}
#auth-form input{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;padding:11px 13px;color:var(--text);font-size:14px;}
#auth-form input:focus{border-color:var(--purple);}
#auth-form .btn-primary{margin-top:6px;}
.auth-toggle{font-size:13px;color:var(--text-muted);margin-top:20px;}

/* ---- app shell ---- */
#app-shell{position:relative;z-index:1;min-height:100vh;}
nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 28px;background:rgba(10,10,22,0.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);flex-wrap:wrap;}
.nav-logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;letter-spacing:.14em;color:var(--purple-light);flex-shrink:0;}
.nav-tabs{display:flex;gap:6px;overflow-x:auto;}
.tab-btn{background:transparent;border:1px solid transparent;color:var(--text-muted);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;white-space:nowrap;transition:all .2s;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{background:var(--purple-dim);border-color:var(--purple);color:var(--purple-light);}
.nav-user{display:flex;align-items:center;gap:12px;flex-shrink:0;}
#nav-username{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--cyan-light);}
main{max-width:1000px;margin:0 auto;padding:36px 24px 80px;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
.panel-title{font-size:24px;font-weight:700;margin-bottom:28px;}

/* stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
@media(max-width:800px){.stat-grid{grid-template-columns:1fr 1fr;}}
.stat-card{padding:18px;text-align:center;}
.stat-card .val{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--purple-light);display:block;margin-bottom:6px;word-break:break-word;}
.stat-card .lbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;}

/* insight banner */
.insight-banner{padding:16px 20px;margin-bottom:24px;display:flex;gap:12px;align-items:flex-start;border-left:3px solid var(--gold);}
.insight-banner.balanced{border-left-color:var(--green);}
.insight-banner .ic{font-size:18px;}
.insight-banner p{font-size:14px;line-height:1.6;color:var(--text);}

/* forms */
.form-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:28px;}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:140px;}
.field label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;}
.field input,.field select{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;}
.field input:focus,.field select:focus{border-color:var(--purple);}

/* lists */
.list-empty{padding:32px 20px;text-align:center;color:var(--text-muted);font-size:13px;}
.quest-item{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border);}
.quest-item:last-child{border-bottom:none;}
.quest-main{display:flex;flex-direction:column;gap:3px;}
.quest-title{font-weight:600;font-size:14px;}
.quest-meta{font-size:12px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;}
.quest-amt{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--purple-light);font-size:15px;white-space:nowrap;}
.tag{font-size:10px;padding:3px 9px;border-radius:12px;background:rgba(20,184,166,0.12);border:1px solid rgba(20,184,166,0.3);color:var(--cyan-light);text-transform:uppercase;letter-spacing:.05em;}

/* category bars */
.cat-bar-row{margin-bottom:16px;}
.cat-bar-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
.cat-bar-head .amt{font-family:'JetBrains Mono',monospace;color:var(--text-muted);}
.cat-bar-track{height:9px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden;}
.cat-bar-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));box-shadow:0 0 10px rgba(16,185,129,0.5);border-radius:4px;transition:width .8s cubic-bezier(.4,0,.2,1);}

/* goal cards */
.goal-card{padding:18px 20px;margin-bottom:14px;}
.goal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;}
.goal-name{font-weight:700;font-size:15px;}
.goal-price{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-muted);}
.goal-track{height:10px;background:rgba(255,255,255,0.06);border-radius:5px;overflow:hidden;margin-bottom:8px;}
.goal-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#0D9488,var(--cyan-light));box-shadow:0 0 10px rgba(20,184,166,0.5);transition:width .8s cubic-bezier(.4,0,.2,1);}
.goal-fill.ready{background:linear-gradient(90deg,#D97706,var(--gold));box-shadow:0 0 10px rgba(245,158,11,0.5);}
.goal-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-muted);}
.badge-ready{font-size:11px;font-weight:700;color:var(--gold);}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,140%);z-index:200;padding:13px 22px;border-radius:10px;font-size:13px;font-family:'JetBrains Mono',monospace;transition:transform .4s cubic-bezier(.2,1,.3,1);max-width:88vw;text-align:center;}
#toast.show{transform:translate(-50%,0);}
#toast.success{background:rgba(52,211,153,0.12);border:1px solid rgba(52,211,153,0.4);color:var(--green);}
#toast.error{background:rgba(248,113,113,0.12);border:1px solid rgba(248,113,113,0.4);color:var(--red);}

@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important;}.cat-bar-fill,.goal-fill{transition:none;}}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div id="toast"></div>

<!-- ============ AUTH SCREEN ============ -->
<div id="auth-screen">
  <div class="auth-card card">
    <div class="app-logo">EXPENSE&nbsp;TRACKER</div>
    <h1 id="auth-title">Log in</h1>
    <div id="auth-error" class="form-error" hidden></div>
    <form id="auth-form" novalidate>
      <label>Username
        <input id="auth-username" required autocomplete="username" minlength="1">
      </label>
      <label>Password
        <input id="auth-password" type="password" required autocomplete="current-password" minlength="1">
      </label>
      <button type="submit" id="auth-submit-btn" class="btn-primary">Log In</button>
    </form>
    <p class="auth-toggle">New here? <a href="#" id="auth-toggle-link">Create an account</a></p>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app-shell" hidden>
  <nav>
    <span class="nav-logo">EXPENSE&nbsp;TRACKER</span>
    <div class="nav-tabs">
      <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
      <button class="tab-btn" data-tab="expenses">Expenses</button>
      <button class="tab-btn" data-tab="insights">Insights</button>
      <button class="tab-btn" data-tab="savings">Savings</button>
    </div>
    <div class="nav-user">
      <span id="nav-username"></span>
      <button id="logout-btn" class="btn-ghost">Log out</button>
    </div>
  </nav>

  <main>

    <!-- DASHBOARD -->
    <section id="tab-dashboard" class="tab-panel active">
      <span class="eyebrow">// OVERVIEW</span>
      <h2 class="panel-title">Dashboard</h2>

      <div class="stat-grid" id="dash-stats"></div>
      <div id="dash-insight-banner"></div>

      <div class="card" style="padding:0;">
        <div style="padding:18px 20px 4px;font-size:13px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;">RECENT EXPENSES</div>
        <div id="dash-recent"></div>
      </div>
    </section>

    <!-- EXPENSES -->
    <section id="tab-expenses" class="tab-panel">
      <span class="eyebrow">// SPENDING</span>
      <h2 class="panel-title">Expenses</h2>

      <form id="expense-form" class="form-row card" style="padding:18px;">
        <div class="field" style="flex:2;">
          <label for="exp-title">Title</label>
          <input id="exp-title" required placeholder="e.g. Groceries">
        </div>
        <div class="field">
          <label for="exp-amount">Amount (₹)</label>
          <input id="exp-amount" type="number" step="0.01" min="0.01" required placeholder="0.00">
        </div>
        <div class="field">
          <label for="exp-category">Category</label>
          <input id="exp-category" list="category-options" required placeholder="Food">
          <datalist id="category-options">
            <option value="Food"><option value="Transport"><option value="Entertainment">
            <option value="Shopping"><option value="Bills"><option value="Health">
            <option value="Education"><option value="Travel"><option value="Other">
          </datalist>
        </div>
        <button type="submit" class="btn-primary">Log Expense</button>
      </form>

      <div class="card" style="padding:0;" id="expenses-list"></div>
    </section>

    <!-- INSIGHTS -->
    <section id="tab-insights" class="tab-panel">
      <span class="eyebrow">// ANALYTICS</span>
      <h2 class="panel-title">Insights</h2>

      <div class="stat-grid" id="insights-stats" style="grid-template-columns:1fr 1fr;"></div>
      <div id="insights-banner"></div>

      <div class="card" style="padding:20px;">
        <div style="font-size:13px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;margin-bottom:16px;">CATEGORY BREAKDOWN</div>
        <div id="cat-breakdown"></div>
      </div>
    </section>

    <!-- SAVINGS -->
    <section id="tab-savings" class="tab-panel">
      <span class="eyebrow">// SAVINGS &amp; WISHLIST</span>
      <h2 class="panel-title">Savings</h2>

      <div class="stat-grid" id="savings-stats" style="grid-template-columns:1fr;max-width:260px;"></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px;">
        <form id="saving-form" class="card" style="padding:18px;">
          <div style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">Add a saving</div>
          <div class="field" style="margin-bottom:12px;">
            <label for="save-amount">Amount (₹)</label>
            <input id="save-amount" type="number" step="0.01" min="0.01" required placeholder="0.00">
          </div>
          <button type="submit" class="btn-primary" style="width:100%;">Add Saving</button>
        </form>

        <form id="goal-form" class="card" style="padding:18px;">
          <div style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">Add a wishlist goal</div>
          <div class="field" style="margin-bottom:10px;">
            <label for="goal-name">Product</label>
            <input id="goal-name" required placeholder="e.g. Mechanical keyboard">
          </div>
          <div class="field" style="margin-bottom:10px;">
            <label for="goal-price">Target price (₹)</label>
            <input id="goal-price" type="number" step="0.01" min="0.01" required placeholder="0.00">
          </div>
          <div class="field" style="margin-bottom:12px;">
            <label for="goal-link">Product link (optional)</label>
            <input id="goal-link" type="url" placeholder="https://...">
          </div>
          <button type="submit" class="btn-primary" style="width:100%;">Add Goal</button>
        </form>
      </div>

      <div id="goals-list"></div>
    </section>

  </main>
</div>

<script>
/* ============================================================
   STATE + STORAGE
   ============================================================ */
const state = { token: null, username: null };
function loadAuthFromStorage(){
  state.token = localStorage.getItem('set_token');
  state.username = localStorage.getItem('set_username');
}
function saveAuthToStorage(token, username){
  localStorage.setItem('set_token', token);
  localStorage.setItem('set_username', username);
  state.token = token; state.username = username;
}
function clearAuthStorage(){
  localStorage.removeItem('set_token'); localStorage.removeItem('set_username');
  state.token = null; state.username = null;
}

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer;
function showToast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = type || 'success';
  requestAnimationFrame(()=> t.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 3400);
}

/* ============================================================
   API HELPER
   ============================================================ */
async function apiFetch(path, options){
  options = options || {};
  const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;

  let res;
  try {
    res = await fetch(path, Object.assign({}, options, { headers }));
  } catch (e) {
    throw new Error("Can't reach the server. Is your Spring Boot app running on port 8080?");
  }

  const text = await res.text();
  let body = null;
  if (text) { try { body = JSON.parse(text); } catch(e) { body = null; } }

  if (!res.ok) {
    if (res.status === 401 || res.status === 403) {
      logout(true);
      throw new Error('Session expired — please log in again.');
    }
    const msg = (body && body.message) ? body.message : ('Request failed (' + res.status + ')');
    throw new Error(msg);
  }
  return body;
}

/* ============================================================
   AUTH FLOW
   ============================================================ */
let authMode = 'login'; // or 'register'

function setAuthMode(mode){
  authMode = mode;
  const title = document.getElementById('auth-title');
  const btn = document.getElementById('auth-submit-btn');
  const toggle = document.getElementById('auth-toggle-link');
  const err = document.getElementById('auth-error');
  err.hidden = true;
  if (mode === 'login') {
    title.textContent = 'Log in';
    btn.textContent = 'Log In';
    toggle.textContent = 'Create an account';
    document.querySelector('.auth-toggle').firstChild.textContent = 'New here? ';
  } else {
    title.textContent = 'Create Account';
    btn.textContent = 'Register';
    toggle.textContent = 'Log in instead';
    document.querySelector('.auth-toggle').firstChild.textContent = 'Already playing? ';
  }
}

document.getElementById('auth-toggle-link').addEventListener('click', (e)=>{
  e.preventDefault();
  setAuthMode(authMode === 'login' ? 'register' : 'login');
});

document.getElementById('auth-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const username = document.getElementById('auth-username').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  const btn = document.getElementById('auth-submit-btn');
  errEl.hidden = true;
  btn.disabled = true;
  try {
    const path = authMode === 'login' ? '/api/auth/login' : '/api/auth/register';
    const data = await apiFetch(path, { method: 'POST', body: JSON.stringify({ username, password }) });
    saveAuthToStorage(data.token, data.username);
    enterApp();
    showToast(authMode === 'login' ? 'Welcome back, ' + data.username + '.' : 'Account created. Welcome, ' + data.username + '.', 'success');
  } catch (err) {
    errEl.textContent = err.message;
    errEl.hidden = false;
  } finally {
    btn.disabled = false;
  }
});

function logout(silent){
  clearAuthStorage();
  document.getElementById('app-shell').hidden = true;
  document.getElementById('auth-screen').hidden = false;
  document.getElementById('auth-username').value = '';
  document.getElementById('auth-password').value = '';
  setAuthMode('login');
  if (!silent) showToast('Logged out.', 'success');
}
document.getElementById('logout-btn').addEventListener('click', ()=> logout(false));

function enterApp(){
  document.getElementById('auth-screen').hidden = true;
  document.getElementById('app-shell').hidden = false;
  document.getElementById('nav-username').textContent = state.username;
  switchTab('dashboard');
}

/* ============================================================
   TAB NAVIGATION
   ============================================================ */
const loaders = { dashboard: loadDashboard, expenses: loadExpenses, insights: loadInsights, savings: loadSavings };

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p=> p.classList.toggle('active', p.id === 'tab-' + tab));
  loaders[tab] && loaders[tab]();
}
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> switchTab(btn.dataset.tab));
});

/* ============================================================
   RENDER HELPERS
   ============================================================ */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function money(n){ return '₹' + Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function statCard(val, lbl){
  return '<div class="card stat-card"><span class="val">' + esc(val) + '</span><span class="lbl">' + esc(lbl) + '</span></div>';
}

function insightBannerHtml(text){
  const balanced = /well balanced/i.test(text || '');
  return '<div class="card insight-banner ' + (balanced ? 'balanced' : '') + '">' +
    '<p>' + esc(text) + '</p></div>';
}

/* ============================================================
   DASHBOARD
   ============================================================ */
async function loadDashboard(){
  const statsEl = document.getElementById('dash-stats');
  const bannerEl = document.getElementById('dash-insight-banner');
  const recentEl = document.getElementById('dash-recent');
  statsEl.innerHTML = ''; bannerEl.innerHTML = ''; recentEl.innerHTML = '<div class="list-empty">Loading…</div>';

  try {
    const [insights, savings, expenses] = await Promise.all([
      apiFetch('/api/insights'),
      apiFetch('/api/savings'),
      apiFetch('/api/expenses')
    ]);

    statsEl.innerHTML =
      statCard(money(insights.totalSpending), 'Total Spending') +
      statCard(insights.highestSpendingCategory || 'N/A', 'Top Category') +
      statCard(money(savings.totalSaved), 'Total Saved') +
      statCard(expenses.length, 'Expenses Logged');

    bannerEl.innerHTML = insightBannerHtml(insights.smartInsight);

    if (!expenses.length) {
      recentEl.innerHTML = '<div class="list-empty">No expenses yet — log your first one in the Expenses tab.</div>';
    } else {
      recentEl.innerHTML = expenses.slice(0, 5).map(e=>
        '<div class="quest-item"><div class="quest-main"><span class="quest-title">' + esc(e.title) + '</span>' +
        '<span class="quest-meta">' + esc(e.date) + ' · <span class="tag">' + esc(e.category) + '</span></span></div>' +
        '<span class="quest-amt">' + money(e.amount) + '</span></div>'
      ).join('');
    }
  } catch (err) {
    recentEl.innerHTML = '';
    showToast(err.message, 'error');
  }
}

/* ============================================================
   EXPENSES
   ============================================================ */
async function loadExpenses(){
  const listEl = document.getElementById('expenses-list');
  listEl.innerHTML = '<div class="list-empty">Loading…</div>';
  try {
    const expenses = await apiFetch('/api/expenses');
    if (!expenses.length) {
      listEl.innerHTML = '<div class="list-empty">No expenses logged yet. Add your first one above.</div>';
      return;
    }
    listEl.innerHTML = expenses.map(e=>
      '<div class="quest-item"><div class="quest-main"><span class="quest-title">' + esc(e.title) + '</span>' +
      '<span class="quest-meta">' + esc(e.date) + ' · <span class="tag">' + esc(e.category) + '</span></span></div>' +
      '<span class="quest-amt">' + money(e.amount) + '</span></div>'
    ).join('');
  } catch (err) {
    listEl.innerHTML = '';
    showToast(err.message, 'error');
  }
}

/* ============================================================
   INSIGHTS
   ============================================================ */
async function loadInsights(){
  const statsEl = document.getElementById('insights-stats');
  const bannerEl = document.getElementById('insights-banner');
  const catEl = document.getElementById('cat-breakdown');
  statsEl.innerHTML = ''; bannerEl.innerHTML = ''; catEl.innerHTML = '<div class="list-empty">Loading…</div>';

  try {
    const insights = await apiFetch('/api/insights');
    statsEl.innerHTML =
      statCard(money(insights.totalSpending), 'Total Spending') +
      statCard(insights.highestSpendingCategory || 'N/A', 'Highest Category');
    bannerEl.innerHTML = insightBannerHtml(insights.smartInsight);

    const entries = Object.entries(insights.categoryBreakdown || {}).sort((a,b)=> b[1]-a[1]);
    if (!entries.length) {
      catEl.innerHTML = '<div class="list-empty">No expenses yet — nothing to break down.</div>';
    } else {
      const total = insights.totalSpending || 1;
      catEl.innerHTML = entries.map(([cat, amt])=>{
        const pct = Math.round((amt/total)*1000)/10;
        return '<div class="cat-bar-row"><div class="cat-bar-head"><span>' + esc(cat) + '</span>' +
          '<span class="amt">' + money(amt) + ' · ' + pct + '%</span></div>' +
          '<div class="cat-bar-track"><div class="cat-bar-fill" style="width:' + pct + '%"></div></div></div>';
      }).join('');
    }
  } catch (err) {
    catEl.innerHTML = '';
    showToast(err.message, 'error');
  }
}

/* ============================================================
   SAVINGS
   ============================================================ */
async function loadSavings(){
  const statsEl = document.getElementById('savings-stats');
  const goalsEl = document.getElementById('goals-list');
  statsEl.innerHTML = ''; goalsEl.innerHTML = '<div class="card list-empty">Loading…</div>';

  try {
    const [savings, buyingInsights] = await Promise.all([
      apiFetch('/api/savings'),
      apiFetch('/api/savings/insight')
    ]);

    statsEl.innerHTML = statCard(money(savings.totalSaved), 'Total Saved');

    if (!buyingInsights.length) {
      goalsEl.innerHTML = '<div class="card list-empty">No wishlist goals yet. Add one above to start tracking progress.</div>';
      return;
    }
    goalsEl.innerHTML = buyingInsights.map(g=>{
      const ready = g.canBuy;
      const linkHtml = g.productLink ? '<a href="' + esc(g.productLink) + '" target="_blank" rel="noopener">View product</a>' : '';
      return '<div class="card goal-card">' +
        '<div class="goal-head"><div><div class="goal-name">' + esc(g.productName) + '</div>' +
        '<div class="goal-price">' + money(g.targetAmount) + '</div></div>' +
        (ready ? '<span class="badge-ready">Ready to buy</span>' : '') + '</div>' +
        '<div class="goal-track"><div class="goal-fill ' + (ready ? 'ready' : '') + '" style="width:' + g.savedPercent + '%"></div></div>' +
        '<div class="goal-foot"><span>' + g.savedPercent + '% saved</span>' + linkHtml + '</div></div>';
    }).join('');
  } catch (err) {
    goalsEl.innerHTML = '';
    showToast(err.message, 'error');
  }
}

/* ============================================================
   AMBIENT PARTICLE BACKGROUND (lightweight)
   ============================================================ */
(function(){
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, particles = [];
  function resize(){
    w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight;
    const target = Math.min(36, Math.floor(w*h/32000));
    particles = [];
    for (let i=0;i<target;i++){
      particles.push({ x:Math.random()*w, y:Math.random()*h, vx:(Math.random()-.5)*0.25, vy:(Math.random()-.5)*0.25, r:Math.random()*1.5+0.5 });
    }
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    for (const p of particles){
      p.x+=p.vx; p.y+=p.vy;
      if (p.x<0||p.x>w) p.vx*=-1;
      if (p.y<0||p.y>h) p.vy*=-1;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba(52,211,153,0.5)'; ctx.fill();
    }
    for (let i=0;i<particles.length;i++) for (let j=i+1;j<particles.length;j++){
      const a=particles[i], b=particles[j], d=Math.hypot(a.x-b.x,a.y-b.y);
      if (d<120){ ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
        ctx.strokeStyle='rgba(16,185,129,'+(0.1*(1-d/120))+')'; ctx.lineWidth=1; ctx.stroke(); }
    }
    if (!reduceMotion) requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize();
  if (!reduceMotion) draw();
  else { for (const p of particles){ ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle='rgba(52,211,153,0.35)'; ctx.fill(); } }
})();
