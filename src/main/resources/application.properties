spring.application.name=smart-expense-tracker
server.port=8080

# ---- H2 file-based database (persists under ./data, mirroring the original file storage) ----
spring.datasource.url=jdbc:h2:file:./data/expensetracker;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- H2 web console at http://localhost:8080/h2-console ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JWT ---- (override the secret via env var JWT_SECRET in production)
jwt.secret=${JWT_SECRET:change-this-demo-secret-please-rotate-in-production-0123456789abcdef}
jwt.expiration-ms=86400000
